apply plugin: 'com.android.application'
// realm-android applied BEFORE the Kotlin plugins on purpose: it auto-switches to kapt
// when it detects Kotlin, but our Realm models are Java and stay on annotationProcessor.
// Applying it first keeps the existing (working) Realm processing path untouched.
apply plugin: 'realm-android'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
// Firebase: uncomment AFTER placing app/google-services.json (downloaded from the
// Firebase console for package com.shumidub.todoapprealm.alpha8). The plugin fails
// the build if that file is missing, so it stays off until the project is set up.
apply plugin: 'com.google.gms.google-services'

android {
    namespace 'com.shumidub.todoapprealm'
    compileSdk 35
    ndkVersion '27.0.12077973'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    defaultConfig {
        applicationId "com.shumidub.todoapprealm.alpha8"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 4
        versionName "v8-claude"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    annotationProcessor 'com.google.dagger:dagger-compiler:2.50'
    implementation 'com.google.dagger:dagger:2.50'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    // Dropped in the Compose migration: RxJava (→ coroutines/Flow),
    // SlidingUpPanel (→ ModalBottomSheet), keyboardvisibilityevent (→ WindowInsets.ime).

    implementation 'com.google.code.gson:gson:2.10.1'

    // Firebase (Realtime Database + email/password Auth). BoM pins compatible versions.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'

    // --- Jetpack Compose (migration) — BoM pins mutually-compatible versions ---
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'   // HorizontalPager, LazyColumn, AnchoredDraggable
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'sh.calvin.reorderable:reorderable:2.4.3'   // LazyColumn drag-reorder
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
